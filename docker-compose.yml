services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_PATH: /data/quick_filler.db
      UPLOADS_DIR: /data/uploads
      MAX_UPLOAD_SIZE: 10485760
      RETENTION_HOURS: 24
    volumes:
      - quick_filler_data:/data
    networks:
      default:
        aliases:
          - backend.railway.internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  quick_filler_data:
